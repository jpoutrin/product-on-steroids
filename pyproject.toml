[project]
name = "product-on-steroids"
version = "0.1.0"
description = "Product-management best-practice skills marketplace for Claude Code — tooling (structural linter, future eval pipeline)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremie Poutrin", email = "jpoutrin@productvista.fr" }]
dependencies = []

[project.scripts]
validate-plugins = "validate_plugins:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The linter lives in tests/ but is packaged as the top-level module
# `validate_plugins` so it can be exposed as the `validate-plugins` script.
only-include = ["tests/validate_plugins.py"]
sources = ["tests"]
